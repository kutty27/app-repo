name: AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo 1
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run App Test
        run: python -m py_compile app/app.py

      - name: AI Validation
        run: python ai/ai-validation.py

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-app:${{ github.sha }} app/

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-app:${{ github.sha }}

      - name: Clone GitOps Repo (Repo 2)
        run: |
          git clone https://github.com/kutty27/gitops-repo.git

      - name: Update image in Repo 2
        run: |
          cd gitops-repo
          sed -i "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/ai-app:${{ github.sha }}|g" apps/ai-app/deployment.yaml

      - name: Commit changes to Repo 2
        run: |
          cd gitops-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "update image version"
          git push
